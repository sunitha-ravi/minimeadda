<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Something exciting is on the way. Stay tuned.">
  <title>Coming Soon | Adda</title>
  <style>
    :root {
      color-scheme: light;
      --white: #ffffff;
      --black: #000000;
      --red: #ff1025;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--white);
      color: var(--black);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .08;
      background-image: linear-gradient(var(--red) 1px, transparent 1px),
                        linear-gradient(90deg, var(--red) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    .page {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 860px);
      padding: 56px 0 28px;
      text-align: center;
    }
    .logo-wrap {
      width: min(100%, 680px);
      margin: 0 auto 18px;
      padding: 8px;
      animation: reveal .9s ease both;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 18px;
      color: var(--black);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      animation: reveal .9s .12s ease both;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 26px;
      height: 1px;
      background: var(--red);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 5.8rem);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 850;
      color: var(--black);
      animation: reveal .9s .2s ease both;
    }
    h1 span { color: var(--red); }
    .subtitle {
      max-width: 480px;
      margin: 22px auto 0;
      color: var(--black);
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.8;
      animation: reveal .9s .3s ease both;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 34px;
      padding: 11px 16px;
      border: 1px solid var(--black);
      border-radius: 999px;
      background: var(--white);
      color: var(--black);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      animation: reveal .9s .4s ease both;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1.8s infinite;
    }
    footer {
      margin-top: 64px;
      color: var(--black);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      animation: reveal .9s .5s ease both;
    }
    footer strong { color: var(--red); font-weight: 800; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.78); }
    }
    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 860px); padding-top: 34px; }
      .logo-wrap { margin-bottom: 16px; padding: 0; }
      .subtitle { max-width: 330px; }
      footer { margin-top: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
      <img class="logo" src="assets/minime-adda-logo.png" alt="Adda logo">
    </div>
    <div class="eyebrow">A new experience is on the way</div>
    <h1>Coming <span>Soon.</span></h1>
    <p class="subtitle">We’re getting things ready. Something exciting is taking shape — and we can’t wait to share it with you.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span> Website under construction</div>
    <footer>MADE WITH PURPOSE <strong>·</strong> LAUNCHING SOON</footer>
  </main>
</body>
</html>
